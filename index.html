<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e9e5d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen Studio">
<link rel="manifest" href="manifest.json">
<title>Kitchen Studio</title>
<style>
:root{--ink:#354238;--muted:#7d877b;--cream:#f3f0e8;--sage:#dce4d7;--sage2:#9dad99;--wood:#c8b69b;--line:#e6e2d8;--white:#fffdf8;--pink:#eadbd8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e6dc;color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,sans-serif}body{padding:0 0 env(safe-area-inset-bottom)}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #9eae96;outline-offset:2px}
.app{max-width:1100px;margin:auto;min-height:100vh;background:var(--cream);box-shadow:0 0 50px #514b3c18;padding-bottom:22px}
header{padding:20px 22px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--muted);font-weight:800}.brand{font-size:clamp(23px,4vw,32px);font-weight:850;letter-spacing:-1.2px}.brand span{color:#91a18a}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.mode{border:1px solid var(--line);background:#faf8f1;padding:9px 12px;border-radius:30px;font-size:11px;white-space:nowrap}
.tabs{display:flex;gap:7px;padding:5px 18px 15px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;border-radius:30px;padding:10px 15px;background:#e7e5dc;color:#647064;font-size:12px;font-weight:700;white-space:nowrap}.tab.active{background:#526b55;color:white;box-shadow:0 3px 9px #526b552b}
main{padding:0 18px}.hero{background:linear-gradient(135deg,#e4e4d8,#d9dfd2);border-radius:20px;padding:15px;margin-bottom:13px;position:relative;overflow:hidden}.hero:after{content:"✳";position:absolute;right:15px;top:-22px;font-size:110px;color:#fff7;pointer-events:none}.hero-title{font-weight:800;font-size:14px}.hero-sub{font-size:11px;color:#707c6e;margin-top:3px}
.kitchen{display:grid;grid-template-columns:1.35fr .85fr;gap:12px}.counter{background:linear-gradient(135deg,#d6c9b4,#c4b59d);border-radius:18px;padding:13px;min-height:260px;box-shadow:inset 0 2px 5px #fff5,0 5px 15px #554b3510}.counter-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:800;letter-spacing:1px;color:#756b5c;margin-bottom:10px}.board{background:linear-gradient(145deg,#eee7d9,#e2d7c4);border:5px solid #b7a58b;border-radius:16px;min-height:190px;padding:13px;display:flex;align-content:flex-start;justify-content:center;align-items:flex-start;gap:9px;flex-wrap:wrap;box-shadow:inset 0 2px 9px #806b4b20}.board.empty{align-items:center;align-content:center}.empty-note{text-align:center;color:#8b806e;font-size:12px;line-height:1.7}.empty-note b{display:block;font-size:35px;font-weight:400}
.side{display:grid;grid-template-rows:1fr 1fr;gap:10px}.appliance{background:#faf9f4;border:1px solid var(--line);border-radius:17px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;min-height:120px}.appliance .emoji{font-size:34px}.appliance b{font-size:13px}.appliance small{font-size:10px;color:var(--muted)}.go{border:0;background:var(--sage);border-radius:9px;padding:8px 10px;font-size:11px;font-weight:750;align-self:flex-start;margin-top:8px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.section-head h2{font-size:14px;margin:0}.section-head span{font-size:10px;color:var(--muted)}
.panel{background:#faf9f4;border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.food{border:1px solid #e9e6dc;background:#fffefa;border-radius:12px;padding:9px 3px;min-width:0;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.food:active{background:#e9eee4}.food .em{font-size:26px}.food .nm{font-size:10px;font-weight:650}.food .qty{font-size:9px;color:#879180}
.food-card{position:relative;background:#fffefa;border:1px solid #e5e0d5;border-radius:13px;padding:7px 8px;text-align:center;min-width:65px;box-shadow:0 3px 6px #78684a13;touch-action:pan-y}.food-card .em{font-size:29px}.food-card .nm{font-size:10px;font-weight:700}.food-card .state{font-size:9px;color:#84907f}.remove{position:absolute;right:-5px;top:-7px;border:0;background:#f2e8e3;color:#8c6459;border-radius:20px;width:20px;height:20px;font-size:12px}
.ingredient-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill{border:1px solid var(--line);background:#fffefa;border-radius:30px;padding:9px 12px;font-size:11px;font-weight:700}.pill.selected{background:#dfe7d9;border-color:#b6c4ad}
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.action{border:0;border-radius:12px;padding:12px 8px;background:#dfe7da;font-size:12px;font-weight:750}.action.warm{background:#eee1d3}.action.rose{background:#eee0df}.action.blue{background:#dce7e6}
.message{font-size:11px;color:#758071;text-align:center;padding:9px 4px;min-height:32px}
.station{background:linear-gradient(145deg,#e3e0d6,#d6d2c6);border-radius:17px;padding:14px}.station-title{text-align:center;font-size:11px;font-weight:850;letter-spacing:1.4px;margin-bottom:12px}.pan{width:min(230px,70vw);height:min(230px,70vw);margin:5px auto 13px;border-radius:50%;background:radial-gradient(circle at 42% 35%,#737b76,#424b46 63%,#303934 65%);border:9px solid #aeb1a9;box-shadow:0 8px 15px #38382f30;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:25px;position:relative}.pan:after{content:"";position:absolute;width:60px;height:13px;background:#747b74;right:-54px;top:49%;border-radius:0 12px 12px 0;z-index:0}.pan span{font-size:28px;z-index:1}.dish{width:min(230px,70vw);height:min(230px,70vw);border-radius:50%;margin:10px auto;background:radial-gradient(circle,#fffefa 0 62%,#e5e1d8 63% 69%,#fff 70%);box-shadow:0 7px 18px #5e55401b;display:flex;align-content:center;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;padding:30px;border:1px solid #e6e1d7}.dish span{font-size:28px}
.status{background:#eef0e8;border-radius:11px;padding:10px;font-size:11px;color:#64715f;text-align:center;margin-top:10px}
footer{text-align:center;color:#9a9c90;font-size:9px;letter-spacing:1.5px;padding:17px}
@media(max-width:620px){header{padding:16px}.tabs{padding-left:13px}main{padding:0 12px}.kitchen{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.appliance{min-height:125px}.board{min-height:175px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:800px){main{padding:0 26px}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.food{min-height:88px}}
</style>
</head>
<body><div class="app">
<header><div><div class="eyebrow">MY LITTLE COOKING GAME</div><div class="brand">Kitchen Studio <span>✳</span></div><div class="subtitle">Ta cuisine, tes envies, aucune règle.</div></div><div class="mode">☀️ Mode détente</div></header>
<nav class="tabs" id="tabs">
<button class="tab active" data-page="kitchen">🏡 Cuisine</button><button class="tab" data-page="fridge">🧊 Frigo</button><button class="tab" data-page="prep">🔪 Préparation</button><button class="tab" data-page="stove">🍳 Cuisson</button><button class="tab" data-page="plate">🍽️ Dressage</button>
</nav>
<main>
<div class="hero"><div class="hero-title">Bienvenue dans ton petit atelier culinaire ✨</div><div class="hero-sub">Prends ce qui te fait envie et invente ton propre plat.</div></div>
<div id="view"></div>
</main><footer>NO RECIPES · NO TIMER · JUST COOK</footer></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const foods=[
['🍅','Tomate','Légumes'],['🥑','Avocat','Légumes'],['🧀','Fromage','Laitages'],['🥚','Œuf','Laitages'],['🍞','Pain','Épicerie'],['🍓','Fraise','Fruits'],['🍄','Champignon','Légumes'],['🥩','Steak','Viandes'],['🍝','Pâtes','Épicerie'],['🥕','Carotte','Légumes'],['🧅','Oignon','Légumes'],['🍋','Citron','Fruits'],['🥛','Lait','Laitages'],['🍫','Chocolat','Desserts'],['🧄','Ail','Légumes'],['🌶️','Piment','Épicerie'],['🥔','Pomme de terre','Légumes'],['🥦','Brocoli','Légumes'],['🍌','Banane','Fruits'],['🫑','Poivron','Légumes'],['🐟','Poisson','Poissons'],['🍚','Riz','Épicerie'],['🫐','Myrtilles','Fruits'],['🥒','Concombre','Légumes'],['🍦','Glace','Desserts'],['🧈','Beurre','Laitages'],['🍯','Miel','Épicerie'],['🥓','Bacon','Viandes'],['🍤','Crevette','Poissons'],['🥬','Salade','Légumes'],['🍐','Poire','Fruits'],['🍊','Orange','Fruits'],['🥐','Croissant','Épicerie'],['🧁','Cupcake','Desserts'],['🍪','Cookie','Desserts'],['🫒','Olives','Épicerie'],['🌽','Maïs','Légumes'],['🍆','Aubergine','Légumes'],['🥜','Noix','Épicerie'],['🍇','Raisin','Fruits']
];
let basket=JSON.parse(localStorage.getItem('ks-basket')||'[]'),pan=[],plate=[],page='kitchen',message='Choisis tes ingrédients pour commencer.',category='Tout',tool='Couteau';
const save=()=>localStorage.setItem('ks-basket',JSON.stringify(basket));
const card=(f,i)=>`<button class="food" data-add="${i}"><span class="em">${f[0]}</span><span class="nm">${f[1]}</span><span class="qty">＋ Ajouter</span></button>`;
const basketCards=()=>basket.map((f,i)=>`<div class="food-card" draggable="true" data-drag="${i}"><button class="remove" data-remove="${i}" aria-label="Retirer">×</button><div class="em">${f.e}</div><div class="nm">${f.n}</div><div class="state">${f.state}</div></div>`).join('');
const tools=[['🔪','Couteau'],['🪵','Planche'],['🧀','Râpe'],['🥣','Bol'],['🥄','Cuillère'],['🥤','Mixeur'],['🍳','Poêle'],['🥘','Casserole'],['🧁','Moule']];
function tabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function kitchen(){return `<div class="kitchen"><section class="counter"><div class="counter-top"><span>PLAN DE TRAVAIL</span><span>${basket.length} ingrédient${basket.length>1?'s':''}</span></div><div class="board ${basket.length?'':'empty'}" id="board">${basket.length?basketCards():`<div class="empty-note"><b>🥣</b>Ton plan de travail est tout propre.<br>Va chercher de bons ingrédients au frigo !</div>`}</div><div class="message">${message}</div></section><aside class="side"><div class="appliance"><div><div class="emoji">🧊</div><b>Le grand frigo</b><br><small>Fruits, légumes et gourmandises</small></div><button class="go" data-nav="fridge">Ouvrir le frigo →</button></div><div class="appliance"><div><div class="emoji">🍳</div><b>Le coin cuisson</b><br><small>Poêle, casserole et four</small></div><button class="go" data-nav="stove">Aller cuisiner →</button></div></aside></div><div class="section-head"><h2>🔧 À portée de main</h2><span>Choisis ton matériel</span></div><div class="panel"><div class="grid">${tools.slice(0,6).map(t=>`<button class="food" data-tool="${t[1]}"><span class="em">${t[0]}</span><span class="nm">${t[1]}</span></button>`).join('')}</div><div class="status">Ustensile sélectionné : <b>${tool}</b></div></div>`}
function fridge(){let cats=['Tout','Légumes','Fruits','Viandes','Poissons','Laitages','Épicerie','Desserts'];return `<div class="panel"><div class="section-head" style="margin-top:0"><h2>🧊 Le réfrigérateur & les placards</h2><span>${foods.length} ingrédients</span></div><div class="ingredient-actions">${cats.map(c=>`<button class="pill ${category===c?'selected':''}" data-cat="${c}">${c}</button>`).join('')}</div><div class="grid" style="margin-top:12px">${foods.map((f,i)=>({f,i})).filter(x=>category==='Tout'||x.f[2]===category).map(x=>card(x.f,x.i)).join('')}</div></div><div class="status">Appuie sur un ingrédient pour l'ajouter à ton plan de travail. Tu peux en prendre plusieurs !</div>`}
function prep(){return `<div class="station"><div class="station-title">🔪 STATION DE PRÉPARATION</div><div class="board" style="min-height:145px">${basket.length?basketCards():`<div class="empty-note">La planche attend tes ingrédients 🌿</div>`}</div><div class="section-head"><h2>Choisis ton ustensile</h2></div><div class="ingredient-actions">${tools.slice(0,6).map(t=>`<button class="pill ${tool===t[1]?'selected':''}" data-tool="${t[1]}">${t[0]} ${t[1]}</button>`).join('')}</div><div class="section-head"><h2>Préparer les aliments</h2></div><div class="action-grid"><button class="action" data-act="cut">🔪 Couper en morceaux</button><button class="action warm" data-act="peel">🥕 Éplucher</button><button class="action blue" data-act="grate">🧀 Râper</button><button class="action rose" data-act="crush">🥣 Écraser / mixer</button></div><div class="status">${message}</div></div>`}
function stove(){return `<div class="station"><div class="station-title">🍳 TON ESPACE DE CUISSON</div><div class="pan" id="pan">${pan.length?pan.map(f=>`<span>${f.e}</span>`).join(''):'<span style="font-size:12px;color:#eee;position:relative;z-index:1">Poêle vide</span>'}</div><div class="small" style="text-align:center">Ajoute tes ingrédients dans la poêle depuis ton plan de travail.</div><div class="action-grid" style="margin-top:14px"><button class="action warm" data-cook="pan">🍳 Faire revenir</button><button class="action" data-cook="boil">💧 Faire bouillir</button><button class="action rose" data-cook="oven">♨️ Cuire au four</button><button class="action blue" data-cook="simmer">🥘 Laisser mijoter</button></div><div class="ingredient-actions" style="justify-content:center"><button class="pill" data-pan="add">＋ Mettre le panier dans la poêle</button><button class="pill" data-pan="clear">Vider la poêle</button></div><div class="status">${message}</div></div>`}
function dressing(){return `<div class="station"><div class="station-title">🍽️ LE MOMENT DU DRESSAGE</div><div class="dish">${plate.length?plate.map(f=>`<span>${f.e}</span>`).join(''):'<span style="font-size:13px;color:#aaa">Ton assiette vide</span>'}</div><div class="small" style="text-align:center">Compose ton assiette avec les ingrédients de ton panier.</div><div class="action-grid" style="margin-top:14px"><button class="action" data-serve="basket">✨ Dresser le panier</button><button class="action warm" data-serve="pan">🍳 Dresser la poêle</button><button class="action rose" data-serve="clear">🧽 Vider l'assiette</button><button class="action blue" data-serve="save">💾 Garder ma création</button></div><div class="status">${message}</div></div>`}
function render(){tabs();$('#view').innerHTML=page==='kitchen'?kitchen():page==='fridge'?fridge():page==='prep'?prep():page==='stove'?stove():dressing()}
function setPage(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function update(fn){fn();save();render()}
document.addEventListener('click',e=>{
let b=e.target.closest('button');if(!b)return;
if(b.dataset.page||b.dataset.nav){setPage(b.dataset.page||b.dataset.nav);return}
if(b.dataset.add!==undefined){let f=foods[+b.dataset.add];update(()=>{basket.push({e:f[0],n:f[1],state:'entier'});message=f[1]+' ajouté au plan de travail ! ✨'});return}
if(b.dataset.remove!==undefined){update(()=>{basket.splice(+b.dataset.remove,1);message='Ingrédient retiré.'});return}
if(b.dataset.cat){category=b.dataset.cat;render();return}
if(b.dataset.tool){tool=b.dataset.tool;message=tool+' sélectionné.';render();return}
if(b.dataset.act){if(!basket.length){message='Va d’abord chercher des ingrédients au frigo !';render();return}let states={cut:'coupé en morceaux 🔪',peel:'épluché',grate:'râpé 🧀',crush:'écrasé / mixé'};update(()=>{basket.forEach(f=>f.state=states[b.dataset.act]);message='C’est prêt ! Tu peux continuer à cuisiner.'});return}
if(b.dataset.pan==='add'){if(!basket.length){message='Ton panier est vide !';render();return}pan.push(...basket.map(f=>({...f})));update(()=>{message='Les ingrédients sont dans la poêle !'});return}
if(b.dataset.pan==='clear'){pan=[];message='La poêle est vide.';render();return}
if(b.dataset.cook){if(!pan.length){message='Mets d’abord des ingrédients dans la poêle.';render();return}let s={pan:'doré à la poêle 🍳',boil:'cuit dans l’eau 💧',oven:'cuit au four ♨️',simmer:'mijoté 🥘'}[b.dataset.cook];pan.forEach(f=>f.state=s);message='Miam ! Tes ingrédients sont '+s+'.';render();return}
if(b.dataset.serve){if(b.dataset.serve==='basket')plate.push(...basket.map(f=>({...f})));if(b.dataset.serve==='pan')plate.push(...pan.map(f=>({...f})));if(b.dataset.serve==='clear')plate=[];if(b.dataset.serve==='save'){localStorage.setItem('ks-last-plate',JSON.stringify(plate));message='Ta création est sauvegardée sur cet appareil 💚';render();return}message=plate.length?'Ton assiette est prête ! Quelle œuvre d’art 😍':'Ajoute des ingrédients dans ton assiette.';render();return}
});
let dragged=null;
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(el)dragged=+el.dataset.drag});
document.addEventListener('dragover',e=>{if(e.target.closest('#pan'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest('#pan')&&dragged!==null){e.preventDefault();pan.push({...basket[dragged]});message='Ingrédient ajouté dans la poêle !';render();dragged=null}});
let touchStart=null;
document.addEventListener('touchstart',e=>{let el=e.target.closest('[data-drag]');if(el)touchStart={idx:+el.dataset.drag,x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!touchStart)return;let t=e.changedTouches[0],target=document.elementFromPoint(t.clientX,t.clientY);if(target&&target.closest('#pan')){pan.push({...basket[touchStart.idx]});message='Ingrédient ajouté dans la poêle !';render()}touchStart=null},{passive:true});
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
